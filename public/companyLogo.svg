<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 96" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients for Industrial Petroleum Brand Depth -->
    <linearGradient id="gdShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091C2E" />
      <stop offset="100%" stop-color="#040D17" />
    </linearGradient>
    <linearGradient id="gdTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0B6670" />
    </linearGradient>
    <linearGradient id="gdOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D3B" />
      <stop offset="100%" stop-color="#F28C28" />
    </linearGradient>
    <filter id="gdDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Group: Brand Emblem (Hexagonal Petroleum Facility & GD Monogram) -->
  <g transform="translate(6, 4)" filter="url(#gdDropShadow)">
    <!-- Outer Industrial Hexagonal Shield with Precision Border -->
    <rect
      x="2"
      y="2"
      width="84"
      height="84"
      rx="18"
      fill="url(#gdShieldBg)"
      stroke="#0B6670"
      stroke-width="3"
    />

    <!-- Technical Accent Grid Overlay -->
    <line x1="8" y1="24" x2="80" y2="24" stroke="#0B6670" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
    <line x1="8" y1="64" x2="80" y2="64" stroke="#0B6670" stroke-width="1" stroke-dasharray="2 3" opacity="0.4" />

    <!-- Letter 'G' - Heavy Industrial Petroleum Cut -->
    <path
      d="M40 24 H22 C15 24 10 29 10 36 V52 C10 59 15 64 22 64 H40 V46 H28 V52 H24 C21 52 19 50 19 47 V41 C19 38 21 36 24 36 H40 V24 Z"
      fill="url(#gdTealGrad)"
    />
    <path
      d="M40 24 H22 C15 24 10 29 10 36 V52 C10 59 15 64 22 64 H40 V46 H28 V52 H24 C21 52 19 50 19 47 V41 C19 38 21 36 24 36 H40 V24 Z"
      stroke="#14B8A6"
      stroke-width="1.2"
    />

    <!-- Letter 'D' - High-Contrast Pure White -->
    <path
      d="M46 24 H62 C70 24 76 30 76 38 V50 C76 58 70 64 62 64 H46 V24 Z M54 34 V54 H61 C65 54 68 51 68 47 V41 C68 37 65 34 61 34 H54 Z"
      fill="#FFFFFF"
    />

    <!-- Central Catalytic Orange Flow Droplet -->
    <circle cx="43" cy="44" r="4.5" fill="url(#gdOrangeGrad)" />
    <line x1="38" y1="44" x2="48" y2="44" stroke="#FF9D3B" stroke-width="2.5" stroke-linecap="round" />
    <line x1="43" y1="39" x2="43" y2="49" stroke="#FF9D3B" stroke-width="2.5" stroke-linecap="round" />

    <!-- Offshore Hydrocarbon Indicator Dot -->
    <circle cx="44" cy="74" r="2.5" fill="#14B8A6" />
  </g>

  <!-- Group: Brand Typography (Modern Industrial Geometric Display) -->
  <g transform="translate(104, 0)">
    <!-- Primary Company Name: GROW DONS -->
    <text
      x="0"
      y="48"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="32"
      font-weight="900"
      letter-spacing="1.2"
      fill="#FFFFFF"
    >
      GROW DONS
    </text>

    <!-- Entity Suffix: SERVICES -->
    <text
      x="206"
      y="48"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="20"
      font-weight="700"
      letter-spacing="2.5"
      fill="#14B8A6"
    >
      SERVICES
    </text>

    <!-- Subtle Horizontal Divider -->
    <rect x="0" y="58" width="345" height="2" fill="#0B6670" opacity="0.6" rx="1" />
    <rect x="0" y="58" width="90" height="2" fill="#F28C28" rx="1" />

    <!-- Subtitle: Specialty & Registration -->
    <text
      x="0"
      y="76"
      font-family="'SF Mono', 'Roboto Mono', Menlo, Monaco, Consolas, monospace"
      font-size="10.5"
      font-weight="700"
      letter-spacing="2"
      fill="#F28C28"
    >
      OILFIELD CHEMICALS &amp; SUPPLY
    </text>

    <!-- RC Tax Identification -->
    <text
      x="248"
      y="76"
      font-family="'SF Mono', 'Roboto Mono', Menlo, Monaco, Consolas, monospace"
      font-size="9.5"
      font-weight="600"
      letter-spacing="1.5"
      fill="#94A3B8"
    >
      RC. 1902045
    </text>
  </g>
</svg>
